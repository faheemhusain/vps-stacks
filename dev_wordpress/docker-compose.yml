services:
  wordpress:
    image: wordpress
    restart: always
    ports:
      - 127.0.0.1:8017:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DEV_WORDPRESS_DB_USER:?QA_WORDPRESS_DB_USER is required}
      WORDPRESS_DB_PASSWORD: ${DEV_WORDPRESS_DB_PASSWORD:?QA_WORDPRESS_DB_PASSWORD is required}
      WORDPRESS_DB_NAME: ${DEV_WORDPRESS_DB_NAME:?QA_WORDPRESS_DB_NAME is required}
    volumes:
      - wp_data:/var/www/html
    networks:
      - pangolin_frontend
      - default

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DEV_WORDPRESS_DB_NAME}
      MYSQL_USER: ${DEV_WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${DEV_WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:?DEV_MYSQL_ROOT_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default

volumes:
  db_data:
  wp_data:

networks:
  pangolin_frontend:
    external: true
